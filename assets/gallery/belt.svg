<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe885"/>
      <stop offset="60%" stop-color="#c49c36"/>
      <stop offset="100%" stop-color="#4d3707"/>
    </radialGradient>
    <linearGradient id="metalPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="50%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="strapGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="50%" stop-color="#2d2d2d"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="800" height="500" fill="#0d0d0d"/>
  <circle cx="400" cy="250" r="280" fill="none" stroke="#d20a0a" stroke-width="2" opacity="0.3"/>
  <circle cx="400" cy="250" r="220" fill="none" stroke="#c49c36" stroke-width="1" opacity="0.2"/>
  
  <!-- Belt Strap -->
  <path d="M 50,180 Q 400,140 750,180 L 760,320 Q 400,360 40,320 Z" fill="url(#strapGrad)" stroke="#333" stroke-width="4"/>
  
  <!-- Left Side Plate -->
  <polygon points="180,210 240,195 240,305 180,290" fill="url(#goldGlow)" stroke="#ffe885" stroke-width="3"/>
  
  <!-- Right Side Plate -->
  <polygon points="560,195 620,210 620,290 560,305" fill="url(#goldGlow)" stroke="#ffe885" stroke-width="3"/>
  
  <!-- Main Center Octagon Plate -->
  <polygon points="340,150 460,150 510,200 510,300 460,350 340,350 290,300 290,200" fill="url(#goldGlow)" stroke="#fff2a8" stroke-width="6"/>
  <!-- Inner Octagon -->
  <polygon points="350,170 450,170 490,210 490,290 450,330 350,330 310,290 310,210" fill="#111111" stroke="#ffe885" stroke-width="3"/>
  
  <!-- UFC Logo on Plate -->
  <text x="400" y="260" font-family="'Arial Black', Impact, sans-serif" font-size="54" font-weight="900" font-style="italic" fill="#ffffff" text-anchor="middle" letter-spacing="4">UFC</text>
  <text x="400" y="295" font-family="'Arial', sans-serif" font-size="14" font-weight="bold" fill="#c49c36" text-anchor="middle" letter-spacing="6">WORLD CHAMPION</text>
  
  <!-- Sparks / Highlights -->
  <circle cx="340" cy="165" r="4" fill="#ffffff"/>
  <circle cx="460" cy="165" r="4" fill="#ffffff"/>
  <circle cx="500" cy="220" r="4" fill="#ffffff"/>
  <circle cx="300" cy="220" r="4" fill="#ffffff"/>
  
  <text x="400" y="440" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="3">ЗОЛОТОЙ ПОЯС ЧЕМПИОНА МИРА</text>
</svg>
