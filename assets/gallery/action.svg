<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <radialGradient id="impactGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ff3b30"/>
      <stop offset="70%" stop-color="#800000"/>
      <stop offset="100%" stop-color="#0d0d0d"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#impactGlow)"/>
  
  <!-- Canvas Floor -->
  <polygon points="50,420 750,420 790,500 10,500" fill="#181818" stroke="#333" stroke-width="2"/>
  
  <!-- Kicking Fighter (Striker) -->
  <g transform="translate(180, 80)">
    <!-- Standing leg -->
    <path d="M 120,330 L 140,220" stroke="#ffffff" stroke-width="28" stroke-linecap="round"/>
    <!-- Torso turned -->
    <path d="M 140,220 L 100,120" stroke="#ffffff" stroke-width="32" stroke-linecap="round"/>
    <circle cx="85" cy="80" r="26" fill="#ffffff"/>
    <!-- Guard hands -->
    <path d="M 100,120 L 70,110 L 90,85" stroke="#ffffff" stroke-width="16" stroke-linecap="round" fill="none"/>
    <!-- Extended high kick leg striking across -->
    <path d="M 140,220 L 250,150 L 370,110" stroke="#d20a0a" stroke-width="26" stroke-linecap="round"/>
  </g>
  
  <!-- Impact Starburst at Hit Location -->
  <g transform="translate(540, 190)">
    <circle cx="0" cy="0" r="45" fill="#ffe600" opacity="0.6"/>
    <circle cx="0" cy="0" r="22" fill="#ffffff"/>
    <line x1="-60" y1="-30" x2="60" y2="30" stroke="#ffffff" stroke-width="4"/>
    <line x1="-30" y1="60" x2="30" y2="-60" stroke="#ffffff" stroke-width="4"/>
    <line x1="-60" y1="20" x2="60" y2="-20" stroke="#ffe600" stroke-width="3"/>
  </g>
  
  <!-- Defending Fighter (reeling back) -->
  <g transform="translate(480, 90)">
    <!-- Head knocked back -->
    <circle cx="110" cy="95" r="26" fill="#888888"/>
    <!-- Torso arching back -->
    <path d="M 100,120 L 130,220" stroke="#888888" stroke-width="30" stroke-linecap="round"/>
    <!-- Legs buckling -->
    <path d="M 130,220 L 110,320" stroke="#888888" stroke-width="24" stroke-linecap="round"/>
    <path d="M 130,220 L 170,320" stroke="#888888" stroke-width="24" stroke-linecap="round"/>
  </g>
  
  <text x="400" y="475" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="3">РЕШАЮЩИЙ ХАЙ-КИК И НОКАУТ</text>
</svg>
