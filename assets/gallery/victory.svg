<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <radialGradient id="victoryGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#4a3500"/>
      <stop offset="50%" stop-color="#1c1402"/>
      <stop offset="100%" stop-color="#080808"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#victoryGlow)"/>
  
  <!-- Golden Confetti Sparks -->
  <circle cx="200" cy="80" r="4" fill="#ffe066"/>
  <circle cx="280" cy="140" r="3" fill="#ffe066"/>
  <circle cx="560" cy="90" r="4" fill="#ffe066"/>
  <circle cx="620" cy="150" r="3" fill="#ffe066"/>
  <circle cx="360" cy="60" r="5" fill="#ffffff"/>
  <circle cx="440" cy="70" r="5" fill="#ffffff"/>
  
  <!-- Champion Standing on Cage Fence with Arms Raised -->
  <g transform="translate(400, 160)">
    <!-- Champion Body -->
    <circle cx="0" cy="30" r="28" fill="#ffffff"/>
    <path d="M 0,60 L 0,180" stroke="#ffffff" stroke-width="36" stroke-linecap="round"/>
    
    <!-- Belt Around Waist -->
    <rect x="-35" y="140" width="70" height="26" rx="6" fill="#f0be42" stroke="#ffffff" stroke-width="2"/>
    <polygon points="-10,144 10,144 14,162 -14,162" fill="#111"/>
    
    <!-- Legs -->
    <path d="M 0,180 L -30,270" stroke="#ffffff" stroke-width="24" stroke-linecap="round"/>
    <path d="M 0,180 L 30,270" stroke="#ffffff" stroke-width="24" stroke-linecap="round"/>
    
    <!-- Raised Arms (Victory V) -->
    <path d="M -15,70 L -65,10 L -90,-40" stroke="#d20a0a" stroke-width="20" stroke-linecap="round"/>
    <path d="M 15,70 L 65,10 L 90,-40" stroke="#d20a0a" stroke-width="20" stroke-linecap="round"/>
    
    <!-- Country Flag / Banner behind shoulders -->
    <path d="M -90,-10 Q 0,-30 90,-10 L 80,50 Q 0,30 -80,50 Z" fill="#c49c36" opacity="0.8"/>
  </g>
  
  <text x="400" y="475" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="3">ТРИУМФ И ТИТУЛЬНАЯ ПОБЕДА</text>
</svg>
